<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartMall — 香港時尚網購</title>
  <meta name="description" content="描述場合就有搭配建議、上傳照片找同款、預測價格走勢、門市現貨導航。香港本地取貨與付款。" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" data-nav>
      <span class="brand-mark">◆</span>
      <span class="brand-name">SmartMall</span>
    </a>

    <form class="topsearch" id="topsearch" role="search">
      <input type="search" id="topsearch-input" autocomplete="off"
             placeholder="搜尋商品、品牌或場合…" aria-label="搜尋" />
      <button type="button" class="topsearch-cam" id="topsearch-cam"
              title="上傳照片搜尋" aria-label="以圖搜尋">📷</button>
    </form>

    <nav class="main-nav" id="main-nav">
      <a href="#/" data-nav data-route="" data-i18n="nav.home">首頁</a>
      <a href="#/shop" data-nav data-route="shop" data-i18n="nav.shop">商店</a>
      <a href="#/assistant" data-nav data-route="assistant" data-i18n="nav.assistant">搭配顧問</a>
      <a href="#/stores" data-nav data-route="stores" data-i18n="nav.stores">門市</a>
      <a href="#/memory" data-nav data-route="memory" data-i18n="nav.memory">我的</a>
    </nav>

    <div class="topbar-actions">
      <button class="lang-toggle" id="lang-toggle" title="Switch language / 切換語言">EN</button>
      <a href="#/cart" class="cart-link" data-nav aria-label="購物車">
        <span class="cart-icon">🛒</span>
        <span class="cart-count" id="cart-count">0</span>
      </a>
    </div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu">☰</button>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <strong>SmartMall</strong>
        <p class="muted small" data-i18n="brand.tagline">香港時尚網購 · 先試後買</p>
      </div>
      <nav class="footer-links">
        <a href="#/visual" data-i18n="nav.visual">以圖搜尋</a>
        <a href="#/tryon" data-i18n="nav.tryon">虛擬試穿</a>
        <a href="#/forecast" data-i18n="nav.forecast">價格趨勢</a>
        <a href="#/priceagent" data-i18n="nav.price">跨平台比價</a>
        <a href="#/resale" data-i18n="nav.resale">二手託管</a>
        <a href="#/blindbox" data-i18n="nav.blindbox">造型盒</a>
        <a href="#/support" data-i18n="nav.support">客戶服務</a>
        <a href="#/dashboard" data-i18n="nav.dashboard">商戶後台</a>
      </nav>
      <p class="muted small footer-note" data-i18n="footer.note">FYP 示範網站 · 部分服務以模擬資料呈現</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
